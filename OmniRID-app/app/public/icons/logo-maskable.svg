<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- maskable safe zone: content inside central 80% circle -->
  <rect width="512" height="512" rx="96" fill="#0d0d0d"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a56db"/>
      <stop offset="1" stop-color="#0b3aa5"/>
    </linearGradient>
  </defs>
  <g transform="translate(256,256)">
    <!-- drone quad arms -->
    <g stroke="#fff" stroke-opacity="0.85" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="0" x2="-130" y2="-130"/>
      <line x1="0" y1="0" x2="130" y2="-130"/>
      <line x1="0" y1="0" x2="-130" y2="130"/>
      <line x1="0" y1="0" x2="130" y2="130"/>
    </g>
    <g fill="url(#g)">
      <circle cx="-130" cy="-130" r="34"/>
      <circle cx="130" cy="-130" r="34"/>
      <circle cx="-130" cy="130" r="34"/>
      <circle cx="130" cy="130" r="34"/>
    </g>
    <!-- body -->
    <circle r="58" fill="url(#g)" stroke="#fff" stroke-width="6"/>
    <circle r="24" fill="#fff"/>
    <circle r="24" fill="url(#g)" opacity="0.55"/>
  </g>
</svg>