name: "[repo] Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Generate release notes
        run: |
          VERSION=${{ env.VERSION }}

          cat > release-notes.md << EOF
          # OmniRID v${VERSION}

          Open DroneID transmitter for ESP32 - ASTM F3411-22a / ASD-STAN prEN 4709-002.

          Written in Rust. Firmware builds via the ESP32 Firmware Cross-Build CI
          workflow (\`OmniRID-firmware\`, ESP32/ESP32-S3/ESP32-C6).
          Ground station: Nuxt 4 PWA (\`OmniRID-app\`), headless firmware
          configured over the ESP-RID WiFi access point.

          ## Repository layout

          | Path | Content |
          |------|---------|
          | \`OmniRID-firmware\` | Rust firmware (rid-core, rid-app, bsp-esp32) |
          | \`OmniRID-app\` | Nuxt 4 PWA ground station |
          EOF

          echo "" >> release-notes.md
          echo "## What's Changed" >> release-notes.md

          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV" ]; then
            echo "" >> release-notes.md
            echo "*(initial release)*" >> release-notes.md
          else
            echo "" >> release-notes.md
            git log "$PREV.." --format="  - %s" >> release-notes.md || true
          fi
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          name: OmniRID v${{ env.VERSION }}
          body_path: release-notes.md
