name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Generate release notes
        run: |
          VERSION=${{ env.VERSION }}

          cat > release-notes.md << EOF
          # OmniRID v${VERSION}

          Open DroneID transmitter for ESP32 - ASTM F3411-22a / ASD-STAN prEN 4709-002.

          Written in Rust. Firmware builds via \`cargo +esp build\` (see CI).

          ## Downloads

          | Artifact | Platform |
          |----------|----------|
          | [OmniRID App (PWA)](https://VOLTEKOVER.github.io/OmniRID-Universal-Drone-ID/OmniRID-app/index.html) | Web (installable, offline) |
          EOF

          echo "" >> release-notes.md
          echo "## What's Changed" >> release-notes.md

          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV" ]; then
            echo "" >> release-notes.md
            echo "*(initial release)*" >> release-notes.md
          else
            echo "" >> release-notes.md
            git log "$PREV.." --format="  - %s" >> release-notes.md || true
          fi

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "Full documentation at https://VOLTEKOVER.github.io/OmniRID-Universal-Drone-ID/" >> release-notes.md
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: OmniRID v${{ env.VERSION }}
          body_path: release-notes.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}