name: Security Audit

on:
  push:
    branches: [ "omnirid-webapp-pwa" ]
    paths:
      - 'OmniRID-firmware/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [ "omnirid-webapp-pwa" ]
    paths:
      - 'OmniRID-firmware/**'
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OmniRID-firmware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin
          key: cargo-tools-audit-${{ runner.os }}-v1

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit

      - name: Audit dependencies (workspace)
        run: cargo audit

      - name: Audit dependencies (hardware workspace)
        working-directory: OmniRID-firmware/hardware/bsp-esp32
        run: cargo audit

  cargo-deny:
    name: License & advisory check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OmniRID-firmware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin
          key: cargo-tools-deny-${{ runner.os }}-v1

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny

      - name: Check advisories
        run: cargo deny check advisories

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check bans
        run: cargo deny check bans
