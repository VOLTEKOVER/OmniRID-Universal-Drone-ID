name: Deploy GitHub Pages

on:
  push:
    branches: [ "universal" ]
    paths:
      - 'docs/**'
      - 'OmniRID-app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: OmniRID-app/package-lock.json

      - name: Install web app deps
        run: npm ci
        working-directory: OmniRID-app

      - name: Static build (Nuxt generate)
        run: npm run build
        working-directory: OmniRID-app
        env:
          NUXT_APP_BASE_URL: /OmniRID-Universal-Drone-ID/OmniRID-app/

      - name: Prepare Pages artifact (docs + web app)
        run: |
          mkdir -p _site/OmniRID-app
          cp -r docs _site/docs
          cp -r OmniRID-app/.output/public/* _site/OmniRID-app/
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}