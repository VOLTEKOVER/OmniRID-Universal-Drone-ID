name: "[repo] Deploy OmniRID app to GitHub Pages"

on:
  push:
    branches:
      - omnirid-webapp-pwa
    paths:
      - 'OmniRID-app/**'
      - '.github/workflows/Deploy-OmniRID-app-to-GitHub-Pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-availability:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --oauth2-bearer "$GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404|422)
              echo "::notice title=GitHub Pages unavailable::Deployment will be skipped. Enable GitHub Pages in repository settings; private repositories require an eligible plan."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not check GitHub Pages configuration (HTTP ${status})."
              exit 1
              ;;
          esac

  build:
    runs-on: ubuntu-latest
    env:
      NUXT_APP_BASE_URL: /OmniRID-Universal-Drone-ID/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: OmniRID-app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: OmniRID-app
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt app
        working-directory: OmniRID-app
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: OmniRID-app/.output/public

  deploy:
    needs: [build, pages-availability]
    if: needs.pages-availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
