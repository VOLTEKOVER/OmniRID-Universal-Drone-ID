name: OmniRID App CI

on:
  push:
    branches: [ "universal" ]
    paths:
      - 'OmniRID-app/**'
      - '.github/workflows/omnirid-app-ci.yml'
  pull_request:
    branches: [ "universal" ]
    paths:
      - 'OmniRID-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nuxt build (static PWA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: OmniRID-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: OmniRID-app

      - name: Static build (Nuxt generate)
        run: npm run build
        working-directory: OmniRID-app
        env:
          NUXT_APP_BASE_URL: /OmniRID-Universal-Drone-ID/OmniRID-app/

      - name: Verify artifacts
        run: |
          test -f .output/public/index.html && echo "index OK"
          test -f .output/public/sw.js && echo "SW OK"
          test -f .output/public/manifest.webmanifest && echo "manifest OK"
          test -d .output/public/icons && echo "icons OK"
        working-directory: OmniRID-app

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omnirid-app
          path: OmniRID-app/.output/public
          retention-days: 7