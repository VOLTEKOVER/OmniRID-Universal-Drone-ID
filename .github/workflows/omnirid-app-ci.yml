name: OmniRID App CI

on:
  push:
    branches: [ "universal" ]
    paths:
      - 'OmniRID-app/**'
      - '.github/workflows/omnirid-app-ci.yml'
  pull_request:
    branches: [ "universal" ]
    paths:
      - 'OmniRID-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          for f in src/decoder.js src/tracker.js src/capture.js src/app.js sw.js; do
            node --check "$f" || exit 1
          done
        working-directory: OmniRID-app

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json')); JSON.parse(require('fs').readFileSync('manifest.webmanifest')); console.log('JSON OK')"
        working-directory: OmniRID-app

      - name: Serve smoke test
        run: |
          npx --yes http-server . -p 8080 -c-1 > /dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/ | grep -q 'OmniRID App' || exit 1
          curl -fsS -o /dev/null http://localhost:8080/src/decoder.js
          curl -fsS -o /dev/null http://localhost:8080/src/tracker.js
          curl -fsS -o /dev/null http://localhost:8080/src/capture.js
          curl -fsS -o /dev/null http://localhost:8080/src/app.js
          curl -fsS -o /dev/null http://localhost:8080/manifest.webmanifest
          curl -fsS -o /dev/null http://localhost:8080/sw.js
          echo "SMOKE OK"
        working-directory: OmniRID-app