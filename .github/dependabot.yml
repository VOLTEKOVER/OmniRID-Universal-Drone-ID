version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "ci"
      include: "scope"
    # High cap so nothing ever queues behind a stuck PR: every library must
    # be proposed. Minor/patch arrive batched in one weekly PR per ecosystem,
    # breaking bumps (incl. 0.x minors) get their own PR for individual review.
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/OmniRID-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/OmniRID-firmware"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      firmware-minor-patch:
        update-types: ["minor", "patch"]

  # bsp-esp32 is a standalone workspace (excluded from the OmniRID-firmware
  # workspace glob), so it needs its own entry.
  - package-ecosystem: "cargo"
    directory: "/OmniRID-firmware/hardware/bsp-esp32"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      bsp-minor-patch:
        update-types: ["minor", "patch"]
