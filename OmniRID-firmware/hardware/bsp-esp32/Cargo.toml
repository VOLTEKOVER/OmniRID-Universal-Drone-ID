[package]
name = "bsp-esp32"
version = "0.1.0"
edition = "2021"
description = "ESP32 board glue for the Remote ID firmware. Thin adapter over rid-app: the capability matrix and the ESP-IDF hardware modules (WiFi/BLE injection, NVS, LED, USB, web server, OTA). Hardware code is feature-gated and requires the ESP32 Rust toolchain (espup); caps builds and tests on any host."
license = "MIT"

[features]
default = ["esp32c6"]
# Chip selection: compile-time capability matrix (exactly one).
# These are independent of the hardware feature so caps compiles on any host.
esp32 = []
esp32s3 = []
esp32c6 = []
# Hardware feature: pulls in ESP-IDF sys/svc/hal for real ESP32 builds.
# Use (one chip at a time, with the espup toolchain):
#   cargo build --features esp32,hardware   --target xtensa-esp32-espidf
#   cargo build --features esp32s3,hardware --target xtensa-esp32s3-espidf
#   cargo build --features esp32c6,hardware --target riscv32imac-esp-espidf
hardware = ["dep:esp-idf-sys", "dep:esp-idf-svc", "dep:esp-idf-hal", "dep:spin", "dep:embedded-svc", "dep:log"]

# Danger zone: wireless (WiFi/BLE) drivers for the Real-Time Operating
# System (freeRTOS). The custom sdkconfig below enables the Bluetooth /
# Bluedroid host stack and the USB Serial/JTAG driver; without it the
# generated esp-idf-sys bindings omit all BLE and USB-Serial-JTAG symbols.
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

# Standalone workspace (outside the root workspace, which excludes it with
# exclude = ["hardware"]): different target triple (xtensa/riscv32imc) and a
# dedicated toolchain (espup). Path dependencies into firmware/* cross the
# workspace boundary: this is allowed.
[workspace]

# PATCH esp-idf-svc: use the vendored copy in vendor/ with the high-level `bt`
# module disabled.  The bsp-esp32 firmware only drives Bluetooth through the
# raw `esp_idf_svc::sys` bindings (Bluedroid advertising in `ble.rs`); the
# upstream `bt` module is excluded because it cannot be compiled on classic
# ESP32 (its GATT-client uses BLE-5.0-only APIs).  See
# vendor/esp-idf-svc/src/lib.rs.
[patch.crates-io]
esp-idf-svc = { path = "vendor/esp-idf-svc" }

[build-dependencies]
# The build script consumes the linker/config metadata propagated by
# esp-idf-sys through esp-idf-svc/esp-idf-hal (`embuild::espidf::sysenv`).
# Without it the final binary link loses the `--ldproxy-linker` argument
# and the `ldproxy` linker fails with "Cannot locate argument".
# `features = ["espidf"]` is set unconditionally so build.rs *compiles* on
# host builds too (the call itself is gated at runtime on the `hardware`
# feature — see build.rs); otherwise `embuild::espidf` is configured out
# and even `cargo test` for the host-only `caps` matrix fails to build.
embuild = { version = "0.33", features = ["espidf"] }

[dependencies]
rid-app = { path = "../../firmware/rid-app" }
rid-interface = { path = "../../firmware/rid-interface" }
rid-core = { path = "../../firmware/rid-core" }
out-astm = { path = "../../outputs/out-astm" }
app = { path = "../../firmware/app" }

# libc 0.2.190+ switched newlib's `stat` to `st_atim`/`st_mtim`/`st_ctim`,
# but the std sources used by `-Z build-std` (esp32c6) still read
# `st_atime`/`st_mtime`/`st_ctime`, so building std with libc 0.2.191 fails.
# Pin the last compatible release for ESP-IDF targets.
[target.'cfg(target_os = "espidf")'.dependencies]
libc = "=0.2.189"

# ESP-IDF hardware dependencies (only when the `hardware` feature is active).
# `default-features = false` keeps `binstart` OUT: the firmware defines its own
# `app_main`, so esp-idf-sys must not generate a second one.  (Without this,
# defaults enable `binstart` transitively through esp-idf-hal/esp-idf-svc and
# the link fails with "multiple definition of `app_main`".)
# Issue #43: esp-idf-sys 0.38 adds basic ESP-IDF 6.0 compatibility (0.38.1
# additionally fixes the Mbed TLS header set); esp-idf-svc/esp-idf-hal move
# to 0.53/0.47 accordingly (0.53 requires esp-idf-sys ^0.38 + hal ^0.47), and
# vendor/esp-idf-svc was re-vendored from 0.53.0 with the same `bt` patch.
esp-idf-sys = { version = "0.38", default-features = false, features = ["std"], optional = true }
esp-idf-svc = { version = "0.53", default-features = false, features = ["std"], optional = true }
esp-idf-hal = { version = "0.47", default-features = false, features = ["std"], optional = true }
embedded-svc = { version = "0.29", optional = true }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"], optional = true }
log = { version = "0.4", optional = true }
