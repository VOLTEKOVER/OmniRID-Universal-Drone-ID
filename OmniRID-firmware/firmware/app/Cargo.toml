[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Remote ID application layer: assembles BSP, protocol inputs, and broadcast outputs into the rid-core hub."
license = "MIT"

[dependencies]
rid-core = { path = "../rid-core" }
rid-interface = { path = "../rid-interface" }
rid-app = { path = "../rid-app" }
serde_json = { version = "1", default-features = false, features = ["alloc", "preserve_order", "arbitrary_precision"] }
