[workspace]
resolver = "2"
members = [
    "firmware/*",
    "inputs/*",
    "outputs/*",
    "external-libs/*",
]
# hardware/* (bsp-esp32, future bsp-*) stays outside: different target triple
# (xtensa/riscv32imc) and a dedicated toolchain (espup); it is a standalone
# crate with its own [workspace].
exclude = ["hardware"]

[profile.release]
lto = true
codegen-units = 1
strip = true
